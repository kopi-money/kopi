syntax = "proto3";
package kopi.mm;

import "gogoproto/gogo.proto";

option go_package = "github.com/kopi-money/kopi/x/mm/types";

message Loan {
  uint64 index = 1;
  bytes weight = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

message GenesisLoan {
  uint64 index = 1;
  string address = 2;
  bytes weight = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

message GenesisLoans {
  string denom = 1;

  bytes loan_sum = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  bytes weight_sum = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  repeated GenesisLoan loans = 4 [
    (gogoproto.nullable) = false
  ];
}


// Used in production, loans are stored separately with a different key
message LoanSum {
  string denom = 1;
  uint64 num_loans = 2;

  bytes loan_sum = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  bytes weight_sum = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
