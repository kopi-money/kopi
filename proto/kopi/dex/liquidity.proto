syntax = "proto3";
package kopi.dex;

import "gogoproto/gogo.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/kopi-money/kopi/x/dex/types";

message GenesisLiquidityEntry {
  uint64 index = 1;
  string address = 2;
  bytes amount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  uint64 position_index = 4;
  string denom = 5;
}

message Liquidity {
  uint64 index = 1;
  string address = 2;
  bytes amount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  uint64 position_index = 4;
}

message GenesisLiquidityPositions {
  string address = 1;
  uint64 position_index = 2;
  bool auto_compound = 3;
  int64 created_at = 4;
}

message LiquidityPosition {
  bool auto_compound = 1;
  int64 created_at = 2;
}

message GenesisLiquidityAddressSum {
  string address = 1;
  string denom = 2;
  bytes sum = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message LiquiditySum {
  bytes sum = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message GenesisMovingLiquidity {
  string denom = 1;
  bytes amount = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

message MovingLiquidity {
  bytes amount = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}