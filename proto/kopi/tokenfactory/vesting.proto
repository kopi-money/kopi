syntax = "proto3";
package kopi.tokenfactory;

import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/kopi-money/kopi/x/tokenfactory/types";

message VestingNextIndex {
  uint64 index = 1;
}

message Vesting {
  uint64 index = 1;

  string address = 2;
  string factory_denom = 3;

  bytes amount_vested = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  bytes amount_unlocked_per_step = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];

  bytes amount_left = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  repeated google.protobuf.Timestamp next_unlocks = 7 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"next_unlocks\""
  ];
}
