syntax = "proto3";
package kopi.tokenfactory;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "kopi/tokenfactory/params.proto";

option go_package = "github.com/kopi-money/kopi/x/tokenfactory/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc UpdateMinimumUnlock(MsgUpdateMinimumUnlock)                         returns (Void);
  rpc UpdateFeeAmount(MsgUpdateFeeAmount)                                 returns (Void);
  rpc UpdateReserveFeeShare(MsgUpdateReserveFeeShare)                     returns (Void);
  rpc UpdateMinimumPoolSize(MsgUpdateMinimumPoolSize)                     returns (Void);
  rpc UpdateTradeFeeLimits(MsgUpdateTradeFeeLimits)                       returns (Void);
  rpc AddTokenCategory(MsgAddTokenCategory)                               returns (Void);
  rpc UpdateTokenCategory(MsgUpdateTokenCategory)                         returns (Void);
  rpc UpdateMaximumVestingUnlockSteps(MsgUpdateMaximumVestingUnlockSteps) returns (Void);
  rpc UpdateChangeSecondsDescription(MsgUpdateChangeSecondsDescription)   returns (Void);
  rpc UpdateChangeSecondsWebsite(MsgUpdateChangeSecondsWebsite)           returns (Void);
  rpc UpdateChangeSecondsImage(MsgUpdateChangeSecondsImage)               returns (Void);
  rpc MoveLiquidityPool(MsgMoveLiquidityPool)                             returns (Void);
  rpc UpdateMinimumPoolMovingValue(MsgUpdateMinimumPoolMovingValue)       returns (Void);

  rpc CreateDenom(MsgCreateDenom)                                 returns (MsgCreateDenomResponse);
  rpc MintDenom(MsgMintDenom)                                     returns (Void);
  rpc BurnDenom(MsgBurnDenom)                                     returns (Void);
  rpc ChangeAdmin(MsgChangeAdmin)                                 returns (Void);
  rpc Buyback(MsgBuyback)                                         returns (MsgBuybackResponse);
  rpc DisableMinting(MsgDisableMinting)                           returns (Void);
  rpc UpdateDescription(MsgUpdateDescription)                     returns (Void);
  rpc UpdateWebsite(MsgUpdateWebsite)                             returns (Void);
  rpc UpdateIconHash(MsgUpdateIconHash)                           returns (Void);
  rpc UpdateLiquidityPoolSettings(MsgUpdateLiquidityPoolSettings) returns (Void);

  rpc CreatePool(MsgCreatePool)                   returns (Void);
  rpc AddLiquidity(MsgAddLiquidity)               returns (Void);
  rpc AddKCoinLiquidity(MsgAddKCoinLiquidity)     returns (Void);
  rpc AddFactoryLiquidity(MsgAddFactoryLiquidity) returns (Void);
  rpc UnlockLiquidity(MsgUnlockLiquidity)         returns (Void);
  rpc DissolvePool(MsgDissolvePool)               returns (Void);
  rpc CreateOffers(MsgCreateOffers)               returns (Void);
  rpc CancelOffers(MsgCancelOffers)               returns (Void);
  rpc DeclineOffer(MsgDeclineOffer)               returns (Void);
  rpc TakeOffer(MsgTakeOffer)                     returns (Void);
  rpc CreateVestings(MsgCreateVestings)           returns (Void);
  rpc CancelVestings(MsgCancelVestings)           returns (Void);

  rpc Buy(MsgBuy)   returns (MsgTradeResponse);
  rpc Sell(MsgSell) returns (MsgTradeResponse);
}

message MsgCancelVestings {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string full_factory_denom_name = 2;
  repeated uint64 indexes = 3;
}

message MsgCreateVestings {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  repeated string receivers = 2;

  string full_factory_denom_name = 3;
  string factory_denom_amount = 4;

  int64 vested_until = 5;
  int64 num_unlock_steps = 6;
}

message MsgTakeOffer {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  uint64 offer_index = 2;
}

message MsgDeclineOffer {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  uint64 offer_index = 2;
}

message MsgCancelOffers {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  repeated uint64 offer_indexes = 2;
}

message MsgCreateOffers {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  repeated string receivers = 2;

  string full_factory_denom_name = 3;
  string factory_denom_amount = 4;

  string ask_amount = 5;
  string ask_denom = 6;

  int64 valid_until = 7;
  int64 vested_until = 8;
  int64 num_unlock_steps = 9;
}

message MsgBuybackResponse {
  string buyback_amount = 1;
  string burned_amount = 2;
}

message MsgUpdateMinimumPoolMovingValue {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateMinimumPoolMovingValue";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string minimum_pool_moving_value = 2;
}

message MsgMoveLiquidityPool {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgMoveLiquidityPool";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string full_factory_denom_name = 2;
}

message MsgUpdateTradeFeeLimits {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateTradeFeeLimits";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string minimum_pool_fee = 2;
  string maximum_pool_fee = 3;
}

message MsgUpdateChangeSecondsImage {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateChangeSecondsImage";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 change_seconds_image = 2;
}

message MsgUpdateChangeSecondsWebsite {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateChangeSecondsWebsite";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 change_seconds_website = 2;
}

message MsgUpdateChangeSecondsDescription {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateChangeSecondsDescription";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 change_seconds_description = 2;
}

message MsgUpdateMaximumVestingUnlockSteps {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateMaximumVestingUnlockSteps";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 maximum_vesting_steps = 2;
}

message MsgUpdateTokenCategory {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateTokenCategory";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 category_index = 2;
  string name = 3;
  string cost = 4;
  bool is_ibc = 5;
}

message MsgAddTokenCategory {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgAddTokenCategory";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 category_index = 2;
  string name = 3;
  string cost = 4;
  bool is_ibc = 5;
}

message MsgUpdateMinimumUnlock {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateMinimumUnlock";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 minimum_unlock = 2;
}

message MsgUpdateReserveFeeShare {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateReserveFeeShare";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string reserve_fee_share = 2;
}

message MsgUpdateMinimumPoolSize {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateMinimumPoolSize";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string minimum_pool_size = 2;
}

message MsgUpdateFeeAmount {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "kopi/x/tokenfactory/MsgUpdateFeeAmount";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string fee_amount = 2;
}

message MsgCreateDenomResponse {
  string display_name = 1;
  string full_name = 2;
}

message MsgTradeResponse {
  string amount_given_gross = 1;
  string amount_given_net = 2;
  string amount_received_gross = 3;
  string amount_received_net = 4;
  string fee = 5;
  string fee_pool = 6;
  string fee_reserve = 7;
  string price = 8;
  string price_kcoin = 9;
}

message MsgUpdateDescription {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  string full_factory_denom_name = 2;
  string description = 3;
}

message MsgUpdateWebsite {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  string full_factory_denom_name = 2;
  string website = 3;
}

message MsgUpdateImage {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  string full_factory_denom_name = 2;
  string image = 3;
}

message MsgDisableMinting {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  string full_factory_denom_name = 2;
}

message MaxPrice {
  string max_price = 1;
  bool fee_included = 2;
}

message MsgBuy {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  string full_factory_denom_name = 2;
  string denom_giving = 3;
  string denom_receiving = 4;
  string amount = 5;
  MaxPrice max_price = 6 [
    (gogoproto.nullable) = true
  ];
}

message MsgSell {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  string full_factory_denom_name = 2;
  string denom_giving = 3;
  string denom_receiving = 4;
  string amount = 5;
  MaxPrice max_price = 6 [
    (gogoproto.nullable) = true
  ];
}

message MsgAddLiquidity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;

  string factory_denom_amount = 3;
  string maximum_kcoin_amount = 4;
}

message MsgAddKCoinLiquidity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;

  string amount = 3;
}

message MsgAddFactoryLiquidity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;

  string amount = 3;
}

message MsgUnlockLiquidity {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;

  string factory_denom_amount = 3;
}

message MsgCreatePool {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string k_coin = 3;

  string factory_denom_amount = 4;
  string k_coin_amount = 5;

  string pool_fee = 6;
  uint64 unlock_in_seconds = 7;
}

message MsgDissolvePool {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
}

message MsgBuyback {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string buyback_amount = 3;
}

message Void {}

message MsgCreateDenom {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string name = 2;
  string icon_hash = 3;
  string description = 4;
  string website = 5;
  string symbol = 6;
  int64  initial_supply = 7;
  uint64 exponent = 8;
  uint64 category_index = 9;
  bool mintable = 10;

  string local_name = 11;
}

message MsgMintDenom {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string amount = 3;
  string target_address = 4;
}

message MsgBurnDenom {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string amount = 3;
}

message MsgChangeAdmin {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string new_admin = 3;
}

message MsgUpdateIconHash {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string icon_hash = 3;
}

message MsgUpdateLiquidityPoolSettings {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1;
  string full_factory_denom_name = 2;
  string pool_fee = 3;
  uint64 unlock_in_seconds = 4;
}