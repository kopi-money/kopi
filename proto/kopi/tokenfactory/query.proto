syntax = "proto3";
package kopi.tokenfactory;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "kopi/tokenfactory/params.proto";
import "kopi/tokenfactory/denoms.proto";

option go_package = "github.com/kopi-money/kopi/x/tokenfactory/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/kopi/tokenfactory/params";
  }

  rpc Denoms (QueryDenomsRequest) returns (QueryDenomsResponse) {
    option (google.api.http).get = "/kopi/tokenfactory/denoms";
  }

  rpc GetPool (QueryPoolRequest) returns (QueryPoolResponse) {
    option (google.api.http).get = "/kopi/tokenfactory/denoms/pool";
  }

  rpc QuerySimulateSell (QuerySimulateTradeRequest) returns (QuerySimulateTradeResponse) {
    option (google.api.http).get = "/kopi/tokenfactory/simulate/sell";
  }
  rpc QuerySimulateBuy (QuerySimulateTradeRequest) returns (QuerySimulateTradeResponse) {
    option (google.api.http).get = "/kopi/tokenfactory/simulate/buy";
  }
}

message QuerySimulateTradeRequest {
  string denom_giving = 1;
  string denom_receiving = 2;
  string address = 3;
  string amount = 4;
}

message QuerySimulateTradeResponse {
  string amount_given = 1;
  string amount_received = 2;
  string fee = 3;
  string price = 4;
}

message QueryPoolRequest {
  string full_name = 1;
  string address = 2;
}

message QueryPoolResponse {
  string kcoin_denom = 1;
  string kcoin_amount = 2;
  string factory_amount = 3;
  string user_kcoin_amount = 4;
  string user_factory_amount = 5;
  string price = 6;
  int64 created_at = 7;
}

message QueryDenomsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message FactoryDenomData {
  string admin = 1;
  string display_name = 2;
  string full_name = 3;
  string description = 4;
  string icon_hash = 5;
  string symbol = 6;
  uint64 exponent = 7;
  int64 supply = 8;
  bool has_pool = 9;
  bool mintable = 10;
}

message QueryDenomsResponse {
  repeated FactoryDenomData denoms = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}